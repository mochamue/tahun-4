const tex=new THREE.CanvasTexture(k);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(13,10);tex.magFilter=THREE.NearestFilter;

scene.add(box(8,.05,5,M3("#e63946"),0,.03,4),box(2,4,1,M3("#8d6e63"),-11.6,2,-7),box(2,4,1,M3("#8d6e63"),11.6,2,-7),box(1,1,1,M3("#43a047"),-9,.5,5),box(1,1,1,M3("#43a047"),9,.5,5));

function mkAv(a){const g=new THREE.Group(),sk=M3(SK[a.s]),sh=M3(SHI[a.sh]),pn=M3(PN[a.p]),ac2=M3(AC[a.c]);
const pv=(x,y,mesh)=>{const p=new THREE.Group();p.position.set(x,y,0);p.add(mesh);g.add(p);return p};

$("#scr").innerHTML=`<div class="box"><h1>Menunggu guru...</h1><p>Kelas akan bermula sebentar lagi. Biarkan halaman ini terbuka.</p></div>`;
peer=new Peer(undefined,{config:ICE});
peer.on("open",id=>{myId=id;dial()});
peer.on("error",e=>{if(e.type=="peer-unavailable")retry(4000);else if(!joined)retry(6000)})}
function retry(ms){clearTimeout(rtm);rtm=setTimeout(dial,ms)}
function dial(){if(joined||!peer||peer.destroyed)return;if(conn){try{conn.close()}catch(e){}}
conn=peer.connect(HOST,{reliable:true});
conn.on("open",()=>{clearTimeout(rtm);joined=true;send(conn,{t:"join",n:myName,av});
call=peer.call(HOST,mic||silent);call.on("stream",rs=>{const a=new Audio();a.srcObject=rs;a.play().catch(()=>{})});
enterRoom(0,5);setInterval(()=>{if(joined)send(conn,{t:"p",x:r2(me.x),z:r2(me.z),h:myHand})},100)});
conn.on("data",onMsg);conn.on("close",()=>{if(joined)ended("Kelas telah tamat atau sambungan terputus.")});
retry(10000)}
function onMsg(d){if(!d||typeof d!="object")return;
if(d.t=="list"){applyList(d.l||[]);setBoard(d.b)}else if(d.t=="s")applySnap(d.p||[],d.sp||[]);else if(d.t=="me"){me.x=me.tx=+d.x||0;me.z=me.tz=+d.z||0}
else if(d.t=="board")setBoard(d.b);else if(d.t=="mute"){if(mic)mic.getAudioTracks()[0].enabled=false;micBtn()}
else if(d.t=="kick")ended("Anda dikeluarkan oleh guru.");else if(d.t=="end")ended("Kelas telah tamat.");else if(d.t=="full")ended("Bilik sudah penuh.")}
function ended(m){joined=false;inRoom=false;if(me){scene.remove(me.g);me=null}for(const id in others)scene.remove(others[id].g);others={};try{peer.destroy()}catch(e){}
["#top","#joy","#btns","#board"].forEach(s=>$(s).style.display="none");$("#panel").style.display="none";$("#scr").style.display="flex";$("#scr").innerHTML=`<div class="box"><h1>${esc(m)}</h1><button class="btn" onclick="location.reload()">Masuk semula</button></div>`}
// ---------- teacher ----------
async function startHost(){const n=$("#nm").value.trim().slice(0,20);ROOM=san($("#rm").value);if(!n||ROOM.length<3){say("Isi nama dan kod bilik (sekurang-kurangnya 3 huruf/nombor).");return}
P.n=n;P.room=ROOM;P.av=av;sv("kt_p",P);myName=n;HOST="pjk-"+ROOM;initAudio();
peer=new Peer(HOST,{config:ICE});
peer.on("open",()=>{myId="host";enterRoom(0,-6.5);const base=location.href.split("?")[0].replace(/[^/]*$/,"kelas.html"),lk=base+"?bilik="+ROOM;$("#lk").value=lk;
if(mic)watch("host",mic);$("#panel").style.display="block";setInterval(hostTick,100)});
peer.on("error",e=>{if(e.type=="unavailable-id")say("Kod bilik ini sedang digunakan. Tukar kod bilik.");else say("Ralat sambungan: "+e.type)});
peer.on("connection",c=>{c.on("data",d=>hostMsg(c,d));c.on("close",()=>drop(c.peer))});
peer.on("call",c=>{c.answer(mic||silent);hostCalls.push(c);c.on("stream",rs=>{const a=new Audio();a.srcObject=rs;a.play().catch(()=>{});auds[c.peer]=a;watch(c.peer,rs)})})}
function hostMsg(c,d){if(!d||typeof d!="object")return;const id=c.peer;
if(d.t=="join"){if(Object.keys(users).length>=40){send(c,{t:"full"});setTimeout(()=>c.close(),300);return}
const u=users[id]={conn:c,n:String(d.n||"Murid").slice(0,20),av:sanAv(d.av),x:(Math.random()-.5)*14,z:3+Math.random()*4,h:0};send(c,{t:"me",x:u.x,z:u.z});broadcastList();renderPanel()}
else if(d.t=="p"&&users[id]){const u=users[id];u.x=clamp(+d.x||0,-11.5,11.5);u.z=clamp(+d.z||0,-8.5,8.5);u.h=d.h?1:0}}
function broadcastList(){const l=[{id:"host",n:myName,av,host:1,x:me.x,z:me.z}];for(const id in users){const u=users[id];l.push({id,n:u.n,av:u.av,x:u.x,z:u.z})}
applyList(l);for(const id in users)send(users[id].conn,{t:"list",l,b:boardTxt})}
function drop(id){delete users[id];delete auds[id];delete meters[id];delete blocked[id];hostCalls=hostCalls.filter(c=>c.peer!=id);if(me)broadcastList();renderPanel()}
function hostTick(){if(!me)return;const sp=[];for(const id in meters){if(blocked[id])continue;if(id=="host"&&!micOn())continue;if(level(meters[id])>.08)sp.push(id)}
const p=[["host",r2(me.x),r2(me.z),0]];let s2="";for(const id in users){const u=users[id];p.push([id,r2(u.x),r2(u.z),u.h]);s2+=id+u.h}
applySnap(p,sp);const m={t:"s",p,sp};for(const id in users)send(users[id].conn,m);if(s2!=sig){sig=s2;renderPanel()}}
function renderPanel(){if(!IS_T)return;$("#roster").innerHTML=Object.keys(users).map(id=>{const u=users[id];return`<div class="rr"><span>${u.h?"✋ ":""}${esc(u.n)}</span><button data-a="m" data-i="${esc(id)}">${blocked[id]?"🔇":"🔊"}</button><button data-a="k" data-i="${esc(id)}">❌</button></div>`}).join("")||"<i>Belum ada murid</i>";$("#cnt").textContent=Object.keys(users).length}
// ---------- wiring ----------
$("#bm").onclick=toggleMic;
$("#bh").onclick=()=>{myHand=myHand?0:1;$("#bh").className="rb"+(myHand?" on":"")};
$("#bp").onclick=()=>{$("#panel").style.display="block"};
$("#px").onclick=()=>{$("#panel").style.display="none"};
$("#roster").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.i,u=users[id];if(!u)return;
if(b.dataset.a=="m"){blocked[id]=!blocked[id];if(auds[id])auds[id].muted=!!blocked[id];if(blocked[id])send(u.conn,{t:"mute"});renderPanel()}
else{send(u.conn,{t:"kick"});setTimeout(()=>{try{u.conn.close()}catch(x){}},300)}};
$("#bs").onclick=()=>{setBoard($("#bt").value);for(const id in users)send(users[id].conn,{t:"board",b:boardTxt})};
$("#bc").onclick=()=>{$("#bt").value="";setBoard("");for(const id in users)send(users[id].conn,{t:"board",b:""})};
$("#ma").onclick=()=>{for(const id in users)send(users[id].conn,{t:"mute"})};
$("#cl").onclick=async()=>{try{await navigator.clipboard.writeText($("#lk").value);alert("Pautan disalin.")}catch(e){alert($("#lk").value)}};
$("#wa").onclick=()=>{window.open("https://wa.me/?text="+encodeURIComponent("Kelas Tilawah bermula. Klik pautan ini untuk masuk:\n"+$("#lk").value),"_blank")};
$("#en").onclick=()=>{if(!confirm("Tamatkan kelas?"))return;for(const id in users)send(users[id].conn,{t:"end"});setTimeout(()=>location.reload(),300)};
init3D();screen();requestAnimationFrame(loop);
</script>
</body>
</html>
