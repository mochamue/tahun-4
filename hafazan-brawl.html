Layla:['proj',0xff9ad5,'beam'],Miya:['proj',0xc6ff6b,'arrow'],Alucard:['sword',0xffffff],Tigreal:['slam',0xffd23f],Eudora:['proj',0x9ad7ff,'bolt'],Zilong:['spear',0xffffff],Balmond:['axe',0xff6a3d],Nana:['proj',0xff9be8,'orb'],Saber:['sword',0x9ad7ff],Franco:['hook',0xaaaaaa],Bruno:['proj',0xffffff,'ball'],Clint:['proj',0xffd23f,'bullet'],Gatotkaca:['slam',0xff9500],Chou:['punch',0xffe08a],Fanny:['cable',0xdddddd]};

const T=(d,f)=>new Promise(r=>TW.push({t:0,d,f,r})),wait=ms=>new Promise(r=>setTimeout(r,ms)),V=(x,y,z)=>new THREE.Vector3(x,y,z);
/* bunyi */
function tn(a,d=.08,ty='square',v=.07){if(!AC)return;a.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)})}

/* model hero */
function lab(t,col){const cv=document.createElement('canvas');cv.width=256;cv.height=64;const g=cv.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,8,256,48);g.fillStyle=col;g.font='bold 32px sans-serif';g.textAlign='center';g.fillText(t,128,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));s.scale.set(3,.75,1);s.position.y=3.8;return s}
function held(k,v,c){const g=new THREE.Group(),B=(geo,cl,x,y,z,b)=>{const m=new THREE.Mesh(geo,b?new THREE.MeshBasicMaterial({color:cl}):new THREE.MeshLambertMaterial({color:cl}));m.position.set(x,y,z);g.add(m);return m};
const box=(w,h,l)=>new THREE.BoxGeometry(w,h,l),sp=r=>new THREE.SphereGeometry(r,10,8);
if(k=='sword'||k=='dash'||k=='hook'){B(box(.1,.1,1.5),0xdddddd,0,0,.8);B(box(.4,.1,.1),0x886622,0,0,.1)}
else if(k=='cable'){B(box(.08,.08,.7),0xdddddd,0,0,.4);B(sp(.12),c,0,0,.8,1)}
else if(k=='spear'){B(box(.06,.06,2),0x8a6a3a,0,0,.9);const t=B(new THREE.ConeGeometry(.12,.4,6),0xdddddd,0,0,2);t.rotation.x=Math.PI/2}
else if(k=='axe'){B(box(.08,.08,1.3),0x7a5a2a,0,0,.6);B(box(.8,.12,.5),0xaaaaaa,0,0,1.2)}
else if(k=='punch'||k=='slam'||k=='fly'){B(sp(k=='punch'?.3:.24),k=='punch'?c:0xf2c9a0,0,0,.05)}
else if(k=='umb'){const m=B(new THREE.ConeGeometry(.25,1.3,8),c,0,0,.7);m.rotation.x=Math.PI/2}
else if(v=='bullet'||v=='beam'){B(box(.15,.2,.5),0x333333,0,0,.3);B(box(.07,.07,.5),0x888888,0,0,.7)}
else if(v=='dagger'||v=='star'){B(box(.06,.06,.5),c,0,0,.3)}
else if(v=='arrow'){const m=B(new THREE.TorusGeometry(.5,.04,6,12,3.2),0x7a5a2a,0,0,.4);m.rotation.y=Math.PI/2}
else if(v=='ball'){B(sp(.3),0xffffff,0,0,.3)}
else{B(box(.07,.07,1.3),0x7a5a2a,0,0,.6);B(sp(.2),c,0,0,1.3,1)}
g.position.set(0,-.85,.3);return g}
function mkHero(col,st,dir,nm,lc){const g=new THREE.Group(),mats=[],M=c=>new THREE.MeshLambertMaterial({color:c}),d=HD[nm]||{},fem=d.f,mus=d.m,sk=0xf2c9a0,at=AT[nm]||AT.Alucard;
const add=(geo,c,x,y,z,keep)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);g.add(m);if(keep)mats.push(m.material);return m};
const sph=r=>new THREE.SphereGeometry(r,14,10),cyl=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,12);
/* kasut & kaki */
for(const s of[-1,1]){add(cyl(.18,.2,.5),0x333344,s*.3,.4,0);add(new THREE.BoxGeometry(.38,.25,.62),0x4a2c14,s*.3,.13,.1);add(new THREE.BoxGeometry(.4,.08,.64),0x222222,s*.3,.02,.1)}

const bd=add(cyl(.55,.7,1.3),col,0,1.25,0,1);if(mus)bd.scale.set(1.3,1,1.15);if(fem)bd.scale.set(.85,1,.85);
add(cyl(.72,.72,.12),0xffd23f,0,.72,0);

/* bahu & lengan */
const sw=mus?.45:.3;for(const s of[-1,1])add(sph(sw),col,s*(mus?.82:.7),1.78,0,1);
add(cyl(mus?.2:.13,mus?.24:.15,.9),sk,.8*dir,1.3,0).rotation.z=.25*dir;

/* kepala */
add(sph(.5),sk,0,2.2,0);for(const s of[-1,1])add(sph(.07),0,s*.18,2.25,.45);
if(fem){add(sph(.56),d.h,0,2.28,-.08).scale.set(1,1.02,.95);add(cyl(.3,.12,1.1),d.h,0,1.65,-.4);add(sph(.2),0xffffff,.42,2.55,.1);const bg=add(new THREE.SphereGeometry(.54,12,8,0,6.28,0,1.2),d.h,0,2.3,.04)}

function mkTower(){const g=new THREE.Group(),m=(geo,c,y)=>{const o=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c}));o.position.y=y;g.add(o);return o};
m(new THREE.CylinderGeometry(1.6,2,1.2,10),0x8a8fa8,.6);m(new THREE.CylinderGeometry(1.1,1.5,3,10),0xb8bdd6,2.7);m(new THREE.CylinderGeometry(1.5,1.2,.5,10),0x6a6f90,4.4);

/* kesan */
function spark(p,col,n=14){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,6,6),new THREE.MeshBasicMaterial({color:col}));m.position.copy(p);m.userData={v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*7,(Math.random()-.5)*7),l:1};sc.add(m);fx.push(m)}}
function mk(geo,col,b){const m=new THREE.Mesh(geo,b?new THREE.MeshBasicMaterial({color:col,transparent:true}):new THREE.MeshLambertMaterial({color:col}));sc.add(m);return m}
function setLine(m,a,b){const d=b.clone().sub(a),l=d.length();m.position.copy(a).addScaledVector(d,.5);m.lookAt(b);m.rotateX(Math.PI/2);m.scale.set(1,Math.max(.01,l),1)}

function shoot(A0,P0,n,gap,t,mkf,arcH,spin){const ps=[];for(let i=0;i<n;i++)ps.push(wait(i*gap*1000).then(async()=>{const m=mkf();await T(t,p=>{m.position.lerpVectors(A0,P0,p);m.position.y+=Math.sin(p*Math.PI)*arcH;m.rotation.z+=spin*.3;m.rotation.x+=spin*.2});sc.remove(m);spark(P0,m.material.color.getHex(),5)}));return Promise.all(ps)}
async function atk(a,tg,hit){busy=1;const u=a.userData,[kd,col,vr]=AT[u.nm]||AT.Alucard,d=a===pl?1:-1,x0=a.position.x,xt=tg.position.x,arm=u.arm,xm=xt-d*1.6;let ret=1,fc=0;
